<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cattura Schermo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      cursor: crosshair;
      user-select: none;
    }

    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      z-index: 9998;
    }

    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
      cursor: crosshair;
    }

    #selectionBox {
      position: fixed;
      border: 2px solid #00ff00;
      background: rgba(0, 255, 0, 0.1);
      pointer-events: none;
      z-index: 10000;
      display: none;
    }

    #instructions {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 15px 30px;
      border-radius: 8px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      z-index: 10001;
      text-align: center;
    }

    #dimensions {
      position: fixed;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 5px 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      z-index: 10002;
      display: none;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="overlay"></div>
  <canvas id="canvas"></canvas>
  <div id="selectionBox"></div>

  <div id="instructions">
    📸 Trascina per selezionare l'area da catturare • ESC per annullare
  </div>

  <div id="dimensions"></div>

  <script src="capture.js"></script>
</body>
</html>
